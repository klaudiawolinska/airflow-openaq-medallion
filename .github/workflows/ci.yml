name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repo
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: ruff check
        run: ruff check .

  dag-integrity:
    name: DAG-integrity (pytest in runtime image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Building the image validates that requirements.txt resolves in the
      # runtime environment. Tests then run against the exact image that is deployed.
      - name: Build Astro runtime image
        run: docker build -t openaq-airflow:ci .
      - name: Run DAG-integrity tests inside the image
        run: docker run --rm openaq-airflow:ci python -m pytest tests -v

  dbt-build:
    name: dbt build (isolated Snowflake fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify CI credentials
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CI_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ] || [ -z "$SNOWFLAKE_CI_PRIVATE_KEY" ]; then
            echo "::error::dbt build requires SNOWFLAKE_ACCOUNT and SNOWFLAKE_CI_PRIVATE_KEY."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dbt
        run: python -m pip install --no-cache-dir -r dbt-requirements.txt
      - name: Configure the isolated dbt target
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CI_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
          SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE }}
        run: |
          profile_dir="$RUNNER_TEMP/openaq-dbt-profile"
          mkdir -p "$profile_dir"
          printf '%s' "$SNOWFLAKE_CI_PRIVATE_KEY" > "$profile_dir/openaq_ci_user_rsa.p8"
          chmod 600 "$profile_dir/openaq_ci_user_rsa.p8"
          cat > "$profile_dir/profiles.yml" <<'EOF'
          openaq:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: OPENAQ_CI_USER
                private_key_path: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY_PATH') }}"
                private_key_passphrase: "{{ env_var('SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE', '') }}"
                database: OPENAQ
                warehouse: OPENAQ_WH
                schema: CI
                role: OPENAQ_CI
                threads: 4
          EOF
          echo "SNOWFLAKE_CI_PRIVATE_KEY_PATH=$profile_dir/openaq_ci_user_rsa.p8" >> "$GITHUB_ENV"
          echo "DBT_PROFILES_DIR=$profile_dir" >> "$GITHUB_ENV"
      - name: Seed CI fixtures and build dbt models
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE }}
        run: |
          dbt seed --project-dir dbt/openaq --profiles-dir "$DBT_PROFILES_DIR" --target ci --full-refresh
          dbt run-operation prepare_ci_sources --project-dir dbt/openaq --profiles-dir "$DBT_PROFILES_DIR" --target ci
          dbt build --project-dir dbt/openaq --profiles-dir "$DBT_PROFILES_DIR" --target ci --select path:models --vars '{"source_schema": "CI"}'
