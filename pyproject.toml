# Tooling configuration for the repository. This is not a Python package.

[tool.ruff]
target-version = "py314"
line-length = 100

# Ignore Astro-generated files.
extend-exclude = [".astro"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, warnings, pyupgrade, bugbear.
select = ["E", "F", "I", "W", "UP", "B"]